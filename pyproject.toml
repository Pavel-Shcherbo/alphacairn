[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphacairn"
version = "0.2.0"
description = "Compare trading hypotheses under explicit timing and execution assumptions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["alphacairn"]

[tool.setuptools.package-data]
alphacairn = ["static/*"]

[tool.setuptools.cmdclass]
build_py = "_build.PackagedExamples"
